<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1a1c">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Parc Mania</title>
<style>
:root{--bg:#0d1315;--panel:#162024;--panel2:#1d2a2f;--line:#25343a;--text:#e8edef;--muted:#90a3aa;--teal:#2ec4b6;--teald:#13806f;--gold:#ffd166;--red:#ff5d7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
body{display:flex;flex-direction:column;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;color:var(--text);color-scheme:dark;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-user-select:none;user-select:none}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
#top{display:flex;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(#11292c,#0b1a1c);color:#fff;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.brand{font-weight:900;font-size:20px;margin-right:auto;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.brand small{display:block;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.3px}
.pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.06);border-radius:999px;padding:7px 12px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill .pl{display:block;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;line-height:1.1}
.pill{line-height:1.15;border-radius:14px;padding:6px 12px}
.ch .big:empty,.ci .e:empty,.goal .ic:empty{display:none}
.goal .ic{color:var(--teal);font-weight:900}
.pill.neg{background:rgba(255,93,122,.35)}
.seg{display:flex;background:rgba(0,0,0,.35);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:#cfd8dc;font-size:15px;padding:6px 11px;border-radius:999px;font-weight:800;min-width:40px}
.seg button.on{background:var(--gold);color:#2a1f00}
#nav{display:flex;gap:6px;padding:8px 12px;background:#0f181b;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav button{flex:none;border:0;background:var(--panel2);border-radius:12px;padding:10px 14px;font-weight:800;font-size:15px;color:var(--muted);position:relative}
#nav button.on{background:var(--teald);color:#fff}
#nav .dot{position:absolute;top:4px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--red)}
#main{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.wrapc{max-width:1200px;margin:0 auto}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;font-size:14.5px;background:var(--gold);color:#2a1f00;white-space:nowrap}
.btn.teal{background:var(--teald);color:#fff}.btn.sec{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:8px 11px;font-size:13.5px}
.btn:disabled{opacity:.35}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi .k{font-size:12.5px;color:var(--muted);font-weight:700}
.kpi .v{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media (max-width:820px){.two{grid-template-columns:1fr}.brand{max-width:100%}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.two .panel{margin-bottom:0}
.panel h3{margin:0 0 10px;font-size:13px;color:var(--teal);text-transform:uppercase;letter-spacing:.6px}
.bar{height:8px;background:#25343a;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--teal);transition:width .4s}
.need{margin:9px 0}
.need .h{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:4px}
.news{font-size:14px;line-height:1.35}
.news div{padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:8px}
.news div:last-child{border:0}
.news .t{color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums;flex:none}
.th{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.th:last-child{border:0}
.th .c{margin-left:auto;font-weight:900;color:var(--teal)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
td,th{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}
td:first-child,th:first-child{text-align:left}
th{font-size:12px;color:var(--muted)}
.pos{color:var(--teal);font-weight:800}.negt{color:var(--red);font-weight:800}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .info{font-weight:700;font-size:15px;margin-right:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:9px}
.ch{display:flex;align-items:center;gap:10px}
.ch .big{font-size:34px;line-height:1}
.ch b{font-size:16px;display:block}
.lvl{font-size:12.5px;color:var(--gold);font-weight:800;display:block;white-space:nowrap}
.ch>div{min-width:0;flex:1}
.st{margin-left:auto;font-size:12px;font-weight:800;border-radius:999px;padding:4px 9px;white-space:nowrap}
.st.ok{background:rgba(46,196,182,.16);color:#6ee7da}.st.wait{background:rgba(255,209,102,.14);color:var(--gold)}.st.ko{background:rgba(255,93,122,.16);color:#ff9aad}
.mini{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.mini b{color:var(--text)}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);margin:2px 4px 2px 0}
.tag.gold{color:var(--gold);border-color:rgba(255,209,102,.3)}
.stp{display:flex;align-items:center;gap:6px}
.stp button{width:40px;height:40px;border-radius:12px;border:0;background:var(--teald);color:#fff;font-size:21px;font-weight:900}
.stp b{min-width:58px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .l{font-weight:700;font-size:15px}
.row .l small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:2px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{background:var(--panel);border:2px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--muted);font-weight:600}
.empty .btn{margin-top:10px}
.cta{background:linear-gradient(135deg,#3b2e0d,#43230f);border:1px solid rgba(255,209,102,.35);border-radius:18px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;font-weight:700}
.cta .btn{margin-left:auto}
.goal{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.goal .ic{font-size:22px;width:30px;text-align:center}
#wrap{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#sheet{background:#121b1e;border:1px solid var(--line);border-radius:22px;width:min(700px,100%);max-height:88vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#sheet h2{margin:0 0 4px;font-size:22px}
#sheet h3{margin:16px 0 8px;font-size:13px;color:var(--teal);text-transform:uppercase;letter-spacing:.6px}
#sheet p{margin:7px 0;line-height:1.45}
.sub{color:var(--muted);font-size:14px}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.ci{background:var(--panel2);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;text-align:left;color:var(--text)}
button.ci{font:inherit}
.ci.sel{border-color:var(--teal);box-shadow:0 0 0 3px rgba(46,196,182,.2)}
.ci.locked{opacity:.45}
.ci .e{font-size:30px}
.ci b{font-size:15px}
.ci .d{font-size:12.5px;color:var(--muted);line-height:1.35}
.ci .btn{margin-top:6px}
.steps{display:flex;gap:6px;margin:6px 0 12px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--teal)}
input.txt{width:100%;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:14px;font-size:18px;font-weight:800;color:var(--text);font-family:inherit;-webkit-user-select:text;user-select:text;outline:none}
input.txt:focus{border-color:var(--teal)}
.sheetacts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%;z-index:20}
.toast{background:rgba(32,44,48,.96);border:1px solid var(--line);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;animation:tin .25s ease-out;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.goalbar{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:700;font-size:14px}
.goalbar .bar{flex:1;min-width:80px;max-width:220px}
</style>
</head>
<body>
<div id="top">
  <div class="brand" id="brand">Parc Mania</div>
  <div class="pill" id="hMoney"></div>
  <div class="pill" id="hGuests"></div>
  <div class="pill" id="hRating"></div>
  <div class="pill" id="hTime"></div>
  <button class="pill" id="sndBtn" style="border:0;color:#fff;cursor:pointer;font-family:inherit"></button>
  <div class="seg" id="speed"><button data-s="0">Pause</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button></div>
</div>
<div id="nav"></div>
<div id="main"><div class="wrapc" id="content"></div></div>
<div id="wrap"><div id="sheet"></div></div>
<div id="toasts"></div>

<script>
"use strict";
// ====================== CATALOGUE ======================
const OPEN=540, CLOSE=1260, MS_PER_MIN=200, SAVE_KEY='parcmania_v4';
const CATALOG={
  teacups:{t:'ride',name:'Tasses folles',e:'☕',cost:2500,plots:2,exc:2.5,cap:12,dur:5,price:2,upkeep:40,d:'Petite attraction familiale, idéale pour démarrer.'},
  carousel:{t:'ride',name:'Carrousel',e:'🎠',cost:3500,plots:2,exc:3,cap:14,dur:6,price:3,upkeep:50,d:'Un classique que petits et grands adorent.'},
  bumper:{t:'ride',name:'Autos tamponneuses',e:'🚗',cost:5000,plots:2,exc:4,cap:10,dur:5,price:3,upkeep:70,unlock:40,d:'Très populaire auprès des ados.'},
  ferris:{t:'ride',name:'Grande roue',e:'🎡',cost:7000,plots:2,exc:4.5,cap:18,dur:10,price:4,upkeep:80,unlock:100,d:'Grande capacité, vue imprenable sur le parc.'},
  haunted:{t:'ride',name:'Maison hantée',e:'👻',cost:8500,plots:2,exc:5.5,cap:12,dur:7,price:5,upkeep:100,unlock:200,d:'Frissons garantis, peu de pannes.'},
  flume:{t:'ride',name:'Rivière rapide',e:'🛶',cost:11000,plots:3,exc:6.5,cap:16,dur:7,price:5,upkeep:130,unlock:350,d:'Rafraîchissante, encore plus prisée par grosse chaleur.'},
  drop:{t:'ride',name:'Tour de chute',e:'🗼',cost:14000,plots:2,exc:8,cap:12,dur:4,price:6,upkeep:170,unlock:550,d:'Sensations fortes sur peu de terrain.'},
  coaster:{t:'ride',name:'Montagnes russes',e:'🎢',cost:22000,plots:4,exc:10,cap:24,dur:5,price:8,upkeep:250,unlock:800,d:'L’attraction phare qui fait venir les foules.'},
  rocket:{t:'ride',name:'Space Rocket',e:'🚀',cost:32000,plots:4,exc:12,cap:20,dur:5,price:10,upkeep:330,unlock:1500,d:'Le summum des sensations. Prestige maximal.'},
  burger:{t:'shop',kind:'food',name:'Burgers',e:'🍔',cost:800,plots:1,price:5,value:7,upkeep:30,rate:2,d:'Calme la faim des visiteurs.'},
  drinks:{t:'shop',kind:'drink',name:'Boissons',e:'🥤',cost:600,plots:1,price:3,value:4,upkeep:20,rate:3,d:'Indispensable par beau temps.'},
  pizza:{t:'shop',kind:'food',name:'Pizzeria',e:'🍕',cost:1000,plots:1,price:6,value:8,upkeep:35,rate:2,unlock:60,d:'Plus chère, mais très appréciée.'},
  icecream:{t:'shop',kind:'ice',name:'Glacier',e:'🍦',cost:900,plots:1,price:3,value:5,upkeep:25,rate:3,unlock:120,d:'Faim et soif à la fois. Cartonne en été.'},
  balloons:{t:'shop',kind:'souvenir',name:'Ballons',e:'🎈',cost:500,plots:1,price:3,value:5,upkeep:15,rate:3,unlock:80,d:'Petit plaisir qui rend les visiteurs heureux.'},
  umbrella:{t:'shop',kind:'umbrella',name:'Parapluies',e:'☂️',cost:700,plots:1,price:6,value:9,upkeep:15,rate:3,unlock:150,d:'Ne se vend que les jours de pluie… mais alors, beaucoup !'},
  gifts:{t:'shop',kind:'souvenir',name:'Boutique souvenirs',e:'🎁',cost:1200,plots:1,price:8,value:12,upkeep:30,rate:2,unlock:250,d:'Gros panier moyen chez les visiteurs ravis.'},
  toilet:{t:'shop',kind:'toilet',name:'Toilettes',e:'🚻',cost:700,plots:1,price:0,value:2,upkeep:20,rate:4,d:'Sans toilettes, les visiteurs partent vite.'},
};
for(const k in CATALOG){CATALOG[k].id=k;CATALOG[k].unlock=CATALOG[k].unlock||0;}
const DECOR={
  flowers:{name:'Massifs de fleurs',e:'🌷',cost:200,pts:2,upkeep:2},
  trees:{name:'Rangée d’arbres',e:'🌳',cost:400,pts:4,upkeep:3},
  benches:{name:'Bancs à l’ombre',e:'🪑',cost:300,pts:2,upkeep:2},
  statue:{name:'Statue',e:'🗿',cost:1000,pts:8,upkeep:5},
  fountain:{name:'Fontaine',e:'⛲',cost:1800,pts:14,upkeep:10},
  garden:{name:'Jardin à thème',e:'🏯',cost:4500,pts:32,upkeep:20,unlock:300},
};
const CAMPAIGNS={
  posters:{name:'Affiches en ville',e:'🪧',cost:500,boost:.2,days:2},
  radio:{name:'Spot radio',e:'📻',cost:2000,boost:.5,days:3},
  tv:{name:'Publicité TV',e:'📺',cost:6000,boost:1,days:4,unlock:400},
};
const WEATHER={
  sun:{e:'☀️',n:'Ensoleillé',arr:1.15,thirst:1.3},
  cloud:{e:'⛅',n:'Nuageux',arr:1,thirst:1},
  rain:{e:'🌧️',n:'Pluie',arr:.55,thirst:.8},
  heat:{e:'🥵',n:'Canicule',arr:1.05,thirst:1.9},
};
const THOUGHTS={
  great:{e:'😍',t:'Ce parc est génial !',good:1},
  crowd:{e:'😵',t:'Il y a beaucoup trop de monde ici'},
  pretty:{e:'🌸',t:'Quel joli parc !',good:1},
  cheap:{e:'👍',t:'L’entrée n’est vraiment pas chère',good:1},
  fun:{e:'🤩',t:'Cette attraction était incroyable !',good:1},
  expensive:{e:'💸',t:'Cette attraction est beaucoup trop chère'},
  shopExp:{e:'🏷️',t:'Les prix des boutiques sont abusés'},
  entryHigh:{e:'🎟️',t:'Le prix d’entrée est exorbitant'},
  hungry:{e:'🍔',t:'J’ai faim et il n’y a rien à manger'},
  thirsty:{e:'🥤',t:'J’ai soif, il n’y a rien à boire'},
  toilet:{e:'🚻',t:'Mais où sont les toilettes ?!'},
  dirty:{e:'🤢',t:'Les allées sont vraiment sales'},
  queue:{e:'⏳',t:'Les files d’attente sont interminables'},
  broken:{e:'🔧',t:'L’attraction que je voulais est en panne'},
  nocash:{e:'🪙',t:'Je n’ai plus assez d’argent'},
  bored:{e:'🥱',t:'Il n’y a pas assez d’attractions'},
  wet:{e:'💧',t:'Je suis trempé, il me faut un parapluie'},
  bad:{e:'😠',t:'Je rentre, ce parc est nul'},
  sick:{e:'🤮',t:'Ce manège m’a rendu malade'},
};
const GOALS=[
  {t:'Construis ta première attraction',p:()=>rides().length/1,r:1000},
  {t:'Ouvre un stand de nourriture et un de boissons',p:()=>(hasKind('food')+hasKind('drink'))/2,r:800},
  {t:'Accueille 50 visiteurs',p:()=>S.totalGuests/50,r:2000},
  {t:'Installe des toilettes et 3 poubelles',p:()=>(hasKind('toilet')+Math.min(3,S.bins)/3)/2,r:1500},
  {t:'Atteins une note de 60 %',p:()=>S.rating/60,r:3000},
  {t:'Possède 6 attractions',p:()=>rides().length/6,r:5000},
  {t:'Améliore une attraction au niveau 3',p:()=>S.b.some(b=>b.lvl>=3)?1:0,r:4000},
  {t:'Accueille 1 000 visiteurs au total',p:()=>S.totalGuests/1000,r:8000},
  {get t(){return S&&S.theme!=='classic'?`Construis ${lc(CATALOG.coaster.name)}`:'Construis les Montagnes russes';},p:()=>S.b.some(b=>b.type==='coaster')?1:0,r:10000},
  {t:'Encaisse 5 000 € de recettes en une journée',p:()=>Math.max(S.bestDay||0,dayIncome())/5000,r:12000},
  {t:'Parc légendaire : 250 visiteurs en même temps et 80 % de note',p:()=>Math.min(guests.length/250,S.rating/80),r:25000},
  {t:'Bâtis un empire : possède 3 parcs',p:()=>PARKS.length/3,r:50000},
];

const SEGS={
  family:{n:'Familles',e:'👨‍👩‍👧',share:.45,cash:[15,60],beauty:1,names:['Julie','Thomas','Sarah','Nicolas','Laura','Kevin','Émilie','Maxime'],age:[29,46]},
  teen:{n:'Ados',e:'🧑‍🎤',share:.3,cash:[8,35],beauty:.5,names:['Lucas','Inès','Noah','Léa','Hugo','Chloé','Enzo','Manon'],age:[14,19]},
  senior:{n:'Seniors',e:'🧓',share:.25,cash:[20,70],beauty:1.7,names:['Monique','Jacques','Christiane','Michel','Françoise','André','Josiane','Marcel'],age:[62,79]},
};
function aff(seg,e){if(seg==='family')return e<=6?1.2:.6;if(seg==='teen')return e>=5?1.5:e>=3.5?.8:.4;return e<=4.5?1.3:.35;}
const ART={teacups:'les Tasses folles',carousel:'le Carrousel',bumper:'les Autos tamponneuses',ferris:'la Grande roue',haunted:'la Maison hantée',flume:'la Rivière rapide',drop:'la Tour de chute',coaster:'les Montagnes russes',rocket:'le Space Rocket'};
const cap1=t=>t.charAt(0).toUpperCase()+t.slice(1);
const DIFFS={easy:{n:'Détente',e:'🌴',money:45000,up:.6,cash:1.2,bank:-25000,d:'45 000 € au départ, charges réduites, visiteurs plus dépensiers.'},
  normal:{n:'Normal',e:'🎢',money:32000,up:1,cash:1,bank:-15000,d:'32 000 € au départ : l’expérience équilibrée.'},
  hard:{n:'Magnat',e:'🦈',money:22000,up:1.4,cash:.85,bank:-6000,d:'22 000 € au départ, charges lourdes, faillite rapide.'}};
const D=()=>DIFFS[S.diff||'normal'];
const pick=a=>a[(Math.random()*a.length)|0];
const maxRel=b=>Math.max(50,100-(b.age||0)*1.5);
const OFFERS=[
  {id:'private',e:'🏢',t:'Soirée d’entreprise',make:()=>({co:pick(['Proximus','Delhaize','Spa Monopole','Ethias','Cockerill']),amt:Math.round(3000+S.rating*40)}),
   d:o=>`La société ${o.co} veut privatiser le parc ce soir de 19h à 21h. Tous les visiteurs devront partir à 19h.`,gain:o=>`+${fmt(o.amt)} ce soir`,
   accept:o=>{S.privateAt=19*60;S.privateAmt=o.amt;}},

function rtInit(b){b.queue=[];b.riders=[];b.running=false;b.timer=0;b.wait=0;b.acc=0;}
function news(txt){S.news.unshift({t:hhmm(S.time),d:S.day,txt});if(S.news.length>40)S.news.length=40;}
function thought(k,g){S.thoughts[k]=(S.thoughts[k]||0)+1;if(g&&!THOUGHTS[k].good)g.issue=k;}

function beautyScore(){let p=0;for(const q of owned())p+=TRAITS[q.trait].beauty||0;for(const k in S.decor)p+=DECOR[k].pts*S.decor[k];return clamp(p*100/(20+usedPlots()*5),0,100)*(S.sponsorDays>0?.75:1);}
function cleanScore(){return 100*Math.exp(-S.dirt/(40+guests.length*.2));}
function appeal(){let a=0;for(const b of rides())a+=exc(b)*(b.broken||b.closed?.5:1);return a;}
function compF(){return clamp(1+(S.rating-S.rival.rating)/80,.65,1.35);}
function fairEntry(){return Math.round(8+Math.min(50,appeal()*1.2));}
function crowd(){let c=30;for(const b of S.b){const it=C(b);c+=it.t==='ride'?cap(b)*2:it.kind==='toilet'?6:8;}return guests.length/c;}

function segWeights(){const w={};for(const k in SEGS){let a=1;for(const b of rides())if(!b.broken)a+=exc(b)*aff(k,exc(b));w[k]=SEGS[k].share*a*(SP()&&SP().seg[k]||1)*THEMES[S.theme||'classic'].seg[k]*LOC().seg[k]*(k==='family'&&isHoliday(S.day)?1.5:1)*(k==='teen'&&dowOf(S.day)===2?1.4:1);}return w;}

function tick(){

  for(const b of S.b){b.yRev=(b.todayRev||0)-upkeep(b);b.yVis=b.todayVis||0;b.todayVis=0;b.todayRev=0;b.closed=false;if(C(b).t==='ride'){b.age=(b.age||0)+1;b.rel=Math.min(b.rel,maxRel(b));if(b.age===25)news(`🧓 ${C(b).e} ${bname(b)} vieillit : pense à la rénover.`);}}
  staffDay();
  S.privateAt=null;S.concert=false;S.special=null;S.rivalPromo=false;if(S.buzz>0)S.buzz--;if(S.sponsorDays>0)S.sponsorDays--;
  const rv=S.rival;rv.base=rv.base||rv.rating;{const tg=clamp(rv.base+(S.rating-55)*.35+(yearOf(S.day)-1)*3,45,85);rv.rating=clamp(rv.rating+(tg-rv.rating)*.08+rnd(-1.5,1.5),35,93);}
  const rr=Math.random();
  if(rr<.07){rv.rating=Math.min(95,rv.rating+6);news(`🏰 ${rv.name} inaugure une nouvelle attraction : leur note grimpe à ${Math.round(rv.rating)} %.`);}
  else if(rr<.13){S.rivalPromo=true;news(`🏷️ ${rv.name} lance une promo aujourd’hui : une partie du public part chez eux.`);}
  S.campaigns=S.campaigns.map(c=>({...c,days:c.days-1})).filter(c=>c.days>0);
  S.weather=S.forecast;S.forecast=pickWeather();S.press=false;S.event=null;
  const r=Math.random();
  if(r<.12){S.event={type:'school',time:600+(Math.random()*240|0)};}
  else if(r<.22){S.event={type:'inspection',time:900};news('📋 Une inspection sanitaire est annoncée pour 15h00 aujourd’hui.');}
  else if(r<.3&&S.rating>=55){S.press=true;news('📰 Un journal publie un article élogieux sur ton parc : affluence en hausse aujourd’hui !');}
  if(dayIn(S.day)===1)news(`${SEASONS[seasonOf(S.day)].e} Début ${seasonOf(S.day)===1?'de l’':'du '}${SEASONS[seasonOf(S.day)].n.toLowerCase()} de l’an ${yearOf(S.day)} !`);
  S.special=S.planned||null;S.planned=null;if(S.special)news(`${SPECIALS[S.special].e} Aujourd’hui : ${SPECIALS[S.special].n} !`);
  news(`${WEATHER[S.weather].e} ${DOW[dowOf(S.day)]} — météo : ${WEATHER[S.weather].n}.`);
  S.offer=null;
  if(S.day>=3&&Math.random()<.3){const def=pick(OFFERS),o=def.make();if(o){o.id=def.id;S.offer=o;}}
  save();closeSheet();render();
  if(S.offer)openSheet(offerHTML);
}

function spend(c,k){if(S.money<c){toast('💸 Pas assez d’argent');return false;}S.money-=c;S.today[k||'build']+=c;return true;}
let pendingCfg=null,dz=null;
function build(type,where,cfg){
  const it=cfg?{...CATALOG[type],...cfg}:CATALOG[type];
  if(S.totalGuests<it.unlock){toast(`🔒 Débloqué à ${num(it.unlock)} visiteurs`);return;}
  const spots=S.parcels.filter(i=>freeIn(i)>=it.plots);
  if(!spots.length){toast('📐 Plus assez de place : achète un nouveau terrain');return;}
  if(where==null){if(spots.length===1)where=spots[0];else{pendingCfg=cfg||null;openSheet(()=>placeHTML(type));return;}}
  if(freeIn(where)<it.plots){toast('📐 Pas assez de place sur ce terrain');return;}
  if(!spend(it.cost))return;
  const b={cfg:cfg?{exc:cfg.exc,cost:cfg.cost,plots:cfg.plots,cap:cfg.cap,dur:cfg.dur,upkeep:cfg.upkeep,len:cfg.len,height:cfg.height,loops:cfg.loops}:undefined,cname:cfg?cfg.name:undefined,parcel:where,id:S.nid++,type,lvl:1,price:it.price,visitors:0,revenue:0,rel:100,broken:false,repairT:0,todayVis:0,todayRev:0,age:0,yRev:null};rtInit(b);
  S.b.push(b);news(`🏗️ Construction : ${it.e} ${cfg?cfg.name:it.name}`);toast(`${it.e} Ouverture : ${cfg?cfg.name:it.name}`);pendingCfg=null;sfx.build();
  closeSheet();if(it.t==='ride')tab='rides';else tab='shops';render();checkGoals();
}
function act(a,v,el){
  const id=+v,b=S.b.find(x=>x.id===id);
  switch(a){
    case'tab':tab=v;confirmKey=null;break;
    case'catalog':openSheet(()=>catalogHTML(v));return;
    case'build':build(v);return;
    case'rebrandMenu':openSheet(rebrandHTML);return;
    case'rebrand':if(v===S.theme){closeSheet();return;}if(spend(5000)){const old=THEMES[S.theme].n;S.theme=v;applyTheme();calcRating();news(`🎭 Nouveau thème : ${THEMES[v].e} ${THEMES[v].n} (fini, ${old.toLowerCase()} !). Les attractions sont renommées.`);toast(`🎭 Bienvenue dans l’univers ${THEMES[v].n}`);}closeSheet();render();return;
    case'buildAt':build(v,+el.dataset.p,v==='coaster'?pendingCfg:null);return;
    case'buyLand':{const q=parcelDef(+v);if(S.parcels.includes(q.i))return;if(spend(q.price)){S.parcels.push(q.i);calcRating();news(`🗺️ Achat du terrain « ${q.name} » (${q.size} emplacements, ${TRAITS[q.trait].n.toLowerCase()}).`);toast(`🗺️ Nouveau terrain : ${q.name}`);}break;}
    case'wz':wiz[el.dataset.k]=el.dataset.k==='parcel'?+v:v;if(el.dataset.k==='loc')wiz.parcel=null;openSheet(welcomeHTML);return;
    case'wzStep':wiz.step=+v;openSheet(welcomeHTML);return;
    case'wzStart':{if(wiz.parcel==null){toast('Choisis ton premier terrain');return;}
      if(wiz.expand){S.money-=EXPAND_COST;news(`🏢 ${fmt(EXPAND_COST)} investis pour ouvrir un nouveau parc.`);save();}else{PARKS=[];CUR=0;}
      newGame({name:(wiz.name||'').trim()||'Mon parc',theme:wiz.theme,loc:wiz.loc,diff:wiz.diff,parcel:wiz.parcel,money:wiz.expand?EXPAND_COST:undefined});
      if(wiz.expand){PARKS.push(null);CUR=PARKS.length-1;toast('🏢 Ton nouveau parc ouvre ses portes !');}else PARKS=[null];S.seenWelcome=true;tab='home';save();closeSheet();render();checkGoals();return;}
    case'price':if(b)b.price=clamp(b.price+ +el.dataset.d,0,60);break;
    case'up':if(b&&b.lvl<3&&spend(upCost(b))){b.lvl++;b.rel=maxRel(b);news(`⬆️ ${C(b).e} ${bname(b)} passe au niveau ${b.lvl}.`);toast(`⬆️ ${bname(b)} : niveau ${b.lvl}`);checkGoals();}break;
    case'repair':if(b&&b.broken&&spend(Math.round(P(b).cost*.08))){b.broken=false;b.rel=maxRel(b);toast('🔧 Réparée !');}break;
    case'renov':if(b&&spend(Math.round(P(b).cost*.3))){b.age=0;b.rel=100;b.broken=false;news(`✨ Rénovation complète : ${C(b).e} ${bname(b)}`);toast('✨ Comme neuve !');}break;
    case'offerYes':{const o=S.offer;S.offer=null;if(o){const def=OFFERS.find(x=>x.id===o.id);if(def.accept(o)!==false){news(`🤝 Offre acceptée : ${def.e} ${def.t}`);toast('🤝 Offre acceptée');}}closeSheet();render();return;}
    case'offerNo':{const o=S.offer;S.offer=null;if(o)news(`🙅 Offre refusée : ${OFFERS.find(x=>x.id===o.id).t}`);closeSheet();render();return;}
    case'sell':if(confirmKey!=='sell'+id){confirmKey='sell'+id;break;}
      if(b){for(const g of b.queue.concat(b.riders))decide(g);S.b=S.b.filter(x=>x!==b);const r=Math.round(P(b).cost*.5);S.money+=r;news(`💥 Démolition : ${C(b).e} ${bname(b)} (+${fmt(r)})`);}confirmKey=null;break;
    case'entry':S.entry=clamp(S.entry+ +v,0,120);break;
    case'bins':if(+v>0){if(spend(60))S.bins++;}else if(S.bins>0)S.bins--;checkGoals();break;
    case'rdLevel':S.rd.level=+v;break;
    case'rdPick':if(S.rd.cur&&S.rd.prog>0&&confirmKey!=='rd'+v){confirmKey='rd'+v;toast('Touche encore pour abandonner la recherche en cours');return;}S.rd.cur=v;S.rd.prog=0;if(!S.rd.level)S.rd.level=1;confirmKey=null;break;
    case'fp':S.fpPrice=clamp(S.fpPrice+ +v,0,60);break;
    case'design':dz={len:2,height:40,loops:2,name:CATALOG.coaster.name};openSheet(designHTML);return;
    case'dz':{const k=el.dataset.k,mx=has('extreme')?{height:120,loops:7,len:3}:{height:80,loops:4,len:3},mn={height:20,loops:0,len:1},st={height:10,loops:1,len:1};
      dz[k]=clamp(dz[k]+ +v*st[k],mn[k],mx[k]);openSheet(designHTML);return;}
    case'dzBuild':{const cfg=coasterStats(dz);cfg.name=(dz.name||'').trim()||CATALOG.coaster.name;pendingCfg=cfg;build('coaster',null,cfg);return;}
    case'switchPark':switchPark(+v);return;
    case'expand':if(!canExpand()){toast('Conditions non remplies');return;}wiz=newWiz(true);openSheet(welcomeHTML);return;
    case'sendTo':{const q=PARKS[+v];if(q&&S.money>=10000){S.money-=10000;q.money+=10000;toast(`💸 10 000 € envoyés à ${q.name}`);}break;}
    case'takeFrom':{const q=PARKS[+v];if(q&&q.money>=10000){q.money-=10000;S.money+=10000;toast(`💰 10 000 € rapatriés de ${q.name}`);}break;}
    case'hire':{const c=(S.cands||[]).find(x=>x.id===id);if(c){S.cands=S.cands.filter(x=>x!==c);S.staff.push(c);news(`🤝 Embauche : ${ROLES[c.role].e} ${c.name} (${ROLES[c.role].n}).`);toast(`🤝 ${c.name} rejoint l’équipe`);}break;}
    case'train':{const m=S.staff.find(x=>x.id===id);if(m&&m.lvl<3&&spend(400*m.lvl)){m.lvl++;m.morale=Math.min(100,m.morale+10);toast(`🎓 ${m.name} passe au niveau ${m.lvl}`);}break;}
    case'raise':{const m=S.staff.find(x=>x.id===id);if(m){m.salary=Math.round(m.salary*1.1);m.morale=Math.min(100,m.morale+15);toast(`💶 ${m.name} est ravi(e)`);}break;}
    case'fire':{if(confirmKey!=='fire'+id){confirmKey='fire'+id;break;}const m=S.staff.find(x=>x.id===id);if(m){S.staff=S.staff.filter(x=>x!==m);for(const o of S.staff)o.morale=Math.max(0,o.morale-5);news(`👋 Licenciement : ${m.name}.`);}confirmKey=null;break;}
    case'decor':{const d=DECOR[v];if(S.totalGuests<(d.unlock||0)){toast(`🔒 Débloqué à ${d.unlock} visiteurs`);return;}if(spend(d.cost)){S.decor[v]=(S.decor[v]||0)+1;calcRating();toast(`${d.e} ${d.name} ajouté`);}break;}
    case'camp':{const c=CAMPAIGNS[v];if(S.totalGuests<(c.unlock||0)){toast(`🔒 Débloqué à ${c.unlock} visiteurs`);return;}
      if(S.campaigns.some(x=>x.k===v)){toast('Cette campagne est déjà en cours');return;}
      if(spend(c.cost,'marketing')){S.campaigns.push({k:v,days:c.days});news(`📣 Campagne lancée : ${c.e} ${c.name} (${c.days} jours).`);toast('📣 Campagne lancée');}break;}
    case'borrow':if(S.loan<50000){S.loan+=10000;S.money+=10000;news('🏦 Emprunt de 10 000 € contracté.');}break;
    case'repay':if(S.loan>0&&S.money>=10000){S.loan-=10000;S.money-=10000;news('🏦 10 000 € de prêt remboursés.');}else toast('💸 Il faut 10 000 € pour rembourser');break;
    case'close':closeSheet();return;
    case'next':if(S.day%YEAR_LEN===0&&!S.yearDone){S.yearDone=true;yearEnd();openSheet(yearHTML);return;}S.yearDone=false;nextDay();return;
    case'special':{const sp=SPECIALS[v];if(S.planned){toast('Un événement est déjà prévu demain');return;}
      if(spend(sp.cost,'marketing')){S.planned=v;S.spUsed=S.spUsed||{};S.spUsed[v]=yearOf(S.day)*10+seasonOf(S.day);news(`🗓️ Événement réservé pour demain : ${sp.e} ${sp.n}.`);toast(`${sp.e} Prévu demain !`);}break;}
    
    case'new':if(confirmKey!=='new'){confirmKey='new';break;}
    case'newOk':try{localStorage.removeItem(SAVE_KEY);}catch(_){}PARKS=[];CUR=0;wiz=newWiz();confirmKey=null;tab='home';render();openSheet(welcomeHTML);return;
  }
  if(a!=='sell'&&a!=='new'&&a!=='fire'&&a!=='rdPick')confirmKey=null;
  render();
}

const TABS=[['home','📊 Tableau de bord'],['rides','🎢 Attractions'],['shops','🍔 Boutiques'],['land','🗺️ Terrains'],['staff','👷 Personnel'],['rd','🔬 Recherche'],['park','🌳 Parc'],['fin','💰 Finances'],['group','🏢 Groupe'],['goals','🎯 Objectifs']];
function stp(a,v,val,extra){return`<div class="stp"><button data-a="${a}" data-v="${v}" data-d="-1" ${extra||''}>−</button><b>${val}</b><button data-a="${a}" data-v="${v}" data-d="1" ${extra||''}>+</button></div>`;}
function stp2(a,val,extra){return`<div class="stp"><button data-a="${a}" data-v="-1" ${extra||''}>−</button><b>${val}</b><button data-a="${a}" data-v="1" ${extra||''}>+</button></div>`;}
function barH(v,col){return`<div class="bar"><i style="width:${clamp(v,0,100)}%;background:${col||(v<40?'#ff5d7a':v<65?'#ffb703':'#2ec4b6')}"></i></div>`;}
function header(){
  $('#brand').innerHTML=noE(`${S.name}<small>${LOC().n} · ${THEMES[S.theme].n}</small>`);
  const m=$('#hMoney');m.innerHTML=`<span class="pl">Caisse</span>${fmt(S.money)}`;m.classList.toggle('neg',S.money<0);

  const broken=S.b.some(b=>b.broken);
  $('#nav').innerHTML=noE(TABS.map(([k,l])=>`<button data-a="tab" data-v="${k}" class="${tab===k?'on':''}">${l}${k==='rides'&&broken?'<span class="dot"></span>':''}</button>`).join(''));
}
function goalBar(){
  const G=GOALS[S.goal];if(!G)return'<div class="goalbar">🏆 Parc légendaire — tous les objectifs sont atteints !</div>';
  return`<div class="goalbar">🎯 <span>${G.t}</span>${barH(G.p()*100,'#2ec4b6')}<span class="sub">+${fmt(G.r)}</span></div>`;

function tips(){

  if(R.length&&!hasKind('drink'))add(9,'🥤','Aucun stand de boissons : tes visiteurs vont avoir soif.','shops');
  if(R.length&&!hasKind('toilet'))add(9,'🚻','Pas de toilettes : les visiteurs repartiront vite et mécontents.','shops');

  if(S.entry>fairEntry()*1.3)add(7,'🎟️',`Ton entrée est trop chère : vise environ ${fairEntry()} €.`,'park');

  if(guests.length>30&&hasKind('toilet')&&A(g=>g.bladder)>60)add(5,'🚻','Les toilettes sont saturées : construis-en d’autres.','shops');
  const q=R.find(b=>b.queue.length>cap(b)*2);if(q)add(5,'⏳',`Énorme file à ${C(q).name} : améliore-la ou ajoute une attraction.`,'rides');
  if(S.forecast==='rain'&&!hasKind('umbrella')&&S.totalGuests>=150)add(5,'☂️','Pluie annoncée demain : un stand de parapluies serait très rentable.','shops');
  if(S.forecast==='heat')add(4,'🥵','Canicule demain : prévois assez de boissons et de glaces.','shops');
  if(usedPlots()>=capacity()-1&&R.length)add(4,'🗺️','Tes terrains sont presque pleins : achètes-en un nouveau.','land');
  if(R.length>=2&&S.rb.beauty<30)add(4,'🌷','Le parc manque de charme : ajoute du décor (les seniors y sont très sensibles).','park');
  const sw=segWeights(),tw=sw.teen/(sw.family+sw.teen+sw.senior);
  if(R.length>=3&&tw<.15)add(3,'🧑‍🎤','Peu d’ados viennent : ils veulent des sensations fortes (⚡ 5 et plus).','rides');
    if(R.length&&S.entry<fairEntry()*.7)add(3,'🎟️',`Ton entrée est bon marché : tu pourrais monter vers ${fairEntry()} €.`,'park');
  const hol=isHoliday(S.day+1)&&!isHoliday(S.day)&&S.day%YEAR_LEN!==0;
  if(hol||dowOf(S.day+1)===5)add(2,'📅',hol?`${holidayName(S.day+1)} dès demain : attends-toi à beaucoup de familles !`:'Le week-end arrive demain : grosse affluence attendue, vérifie tes capacités.','home');
  const old=R.find(b=>(b.age||0)>=25);if(old)add(4,'🧓',`${C(old).name} est usée (fiabilité max ${Math.round(maxRel(old))} %) : une rénovation s’impose.`,'rides');
  if(S.rival&&S.rival.rating>S.rating+5)add(5,'🏰',`${S.rival.name} est mieux noté que toi : il te vole des visiteurs.`,'home');
  {const se=seasonOf(S.day+1),cand=Object.entries(SPECIALS).find(([k,sp])=>sp.season===se&&!(S.spUsed&&S.spUsed[k]===yearOf(S.day)*10+seasonOf(S.day)));
   if(cand&&!S.planned&&S.money>cand[1].cost*2&&dayIn(S.day)>=8&&S.day%YEAR_LEN!==0)add(3,cand[1].e,`Pense à organiser l’événement de saison : ${cand[1].n}.`,'fin');}
  if(S.day%YEAR_LEN===YEAR_LEN-1)add(4,'❄️','Dernier jour de l’année demain : l’hiver coûte cher, garde de la trésorerie.','fin');
  {const low=S.staff.filter(m=>m.morale<35);if(low.length)add(6,'😤',`${low.length} employé(s) ont un moral très bas : augmente-les ou forme-les avant qu’ils ne partent.`,'staff');}

  <p>Tu diriges un parc d’attractions sur un terrain de <b>12 emplacements</b>, face à un concurrent redoutable : <b>WonderLand</b>.</p>
  <p>🎢 <b>Construis des attractions</b> pour attirer des visiteurs : elles sont comprises dans le prix d’entrée.<br>
  🍔 Les visiteurs ont <b>faim, soif</b> et besoin de <b>toilettes</b> : ouvre des boutiques.<br>
  🧹 Engage du <b>personnel</b> pour garder le parc propre et réparer les pannes.<br>
  🌳 <b>Embellis</b> le parc : un parc beau et propre est mieux noté, et une bonne note attire du monde.<br>
  ☀️ Surveille la <b>météo</b> : la pluie fait fuir les visiteurs… sauf si tu vends des parapluies.<br>
  📊 Le <b>tableau de bord</b> te montre en direct ce que pensent tes visiteurs.</p>
  <p class="sub">Les week-ends et les vacances scolaires attirent les foules, et ta clientèle (familles, ados, seniors) n’aime pas les mêmes choses. Le parc ouvre de 9h à 21h. Chaque soir, tu reçois un bilan financier. Suis les objectifs pour gagner des primes !</p>
  <p class="sub">Tu recevras aussi des propositions (soirées privées, sponsors, influenceurs…) à accepter ou refuser, et tes attractions vieilliront.</p>
  <h3>Choisis ta difficulté</h3><div class="cat">${Object.entries(DIFFS).map(([k,d])=>`<div class="ci"><span class="e">${d.e}</span><b>${d.n}</b><span class="d">${d.d}</span><button class="btn sm ${k==='normal'?'teal':''}" data-a="start" data-v="${k}">Jouer</button></div>`).join('')}</div>`;
}
function winHTML(){return`<h2>🏆 Parc légendaire !</h2><p>Bravo, tu as accompli tous les objectifs. Ton parc est l’un des meilleurs du pays !</p><p class="sub">Tu peux continuer à le développer autant que tu veux.</p><div class="sheetacts"><button class="btn" data-a="close">Continuer</button></div>`;}

let sheetFn=null;
function openSheet(fn){sheetFn=fn;$('#sheet').innerHTML=noE(fn());$('#wrap').style.display='flex';modal=true;}
function closeSheet(){$('#wrap').style.display='none';modal=false;sheetFn=null;last=0;}
function toast(s){const d=document.createElement('div');d.className='toast';d.textContent=noE(s).trim();$('#toasts').appendChild(d);
  const all=$('#toasts').children;if(all.length>3)all[0].remove();setTimeout(()=>d.remove(),3200);}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;sfx.click();
  if(el.closest('#speed'))return;
  act(el.dataset.a,el.dataset.v,el);
});
$('#wrap').addEventListener('click',e=>{if(e.target.id==='wrap'&&sheetFn!==dayHTML&&sheetFn!==yearHTML&&(sheetFn!==welcomeHTML||wiz.expand)&&sheetFn!==bankruptHTML&&sheetFn!==offerHTML)closeSheet();});
$('#sndBtn').addEventListener('click',()=>{snd=(snd+2)%3;try{localStorage.setItem('pm_snd',snd);}catch(_){}if(snd)ac();if(actx&&musicGain)musicGain.gain.value=snd===2?.25:0;sndLabel();toast(['🔇 Son coupé','🔊 Effets sonores seuls','🎵 Musique et effets'][snd]);});
$('#speed').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;speed=+b.dataset.s;[...$('#speed').children].forEach(x=>x.classList.toggle('on',x===b));});
document.addEventListener('input',e=>{if(e.target.id==='wzName')wiz.name=e.target.value;if(e.target.id==='dzName'&&dz)dz.name=e.target.value;});
document.addEventListener('pointerdown',()=>{holding=true;if(snd)ac();});
const unhold=()=>setTimeout(()=>{holding=false;},400);
document.addEventListener('pointerup',unhold);document.addEventListener('pointercancel',unhold);

// ====================== SON ======================
let snd=2;try{const v=localStorage.getItem('pm_snd');if(v!=null)snd=+v;}catch(_){}
let actx=null,master=null,musicGain=null,lastCash=0;
function ac(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();master=actx.createGain();master.gain.value=.55;master.connect(actx.destination);
  musicGain=actx.createGain();musicGain.gain.value=.25;musicGain.connect(master);}catch(_){return null;}}if(actx.state==='suspended')actx.resume();return actx;}
function note(f,t0,d,type,vol,dest){if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(dest||master);o.start(t0);o.stop(t0+d+.05);}
const mid=n=>440*Math.pow(2,(n-69)/12);
const sfx={
  click(){if(snd<1||!ac())return;note(1400,actx.currentTime,.04,'triangle',.035);},
  cash(){if(snd<1||!actx||modal)return;const t=performance.now();if(t-lastCash<900)return;lastCash=t;const n=actx.currentTime;note(1318,n,.07,'square',.025);note(1760,n+.06,.16,'square',.025);},
  goal(){if(snd<1||!ac())return;const n=actx.currentTime;[72,76,79,84].forEach((m,i)=>note(mid(m),n+i*.11,.4,'triangle',.12));note(mid(48),n,.8,'triangle',.1);},
  build(){if(snd<1||!ac())return;const n=actx.currentTime;[55,60,64,67].forEach((m,i)=>note(mid(m),n+i*.07,.25,'square',.04));},
  bad(){if(snd<1||!actx)return;const n=actx.currentTime;note(mid(52),n,.25,'sawtooth',.05);note(mid(47),n+.18,.4,'sawtooth',.05);},
};
const MUS={
  classic:{r:60,sc:[0,2,4,5,7,9,11],bpm:132,bar:6,w:'triangle',bw:'triangle',dens:.75},
  pirates:{r:62,sc:[0,2,3,5,7,9,10],bpm:138,bar:6,w:'triangle',bw:'sawtooth',dens:.8},
  western:{r:55,sc:[0,2,4,7,9],bpm:112,bar:8,w:'triangle',bw:'triangle',dens:.6},
  fantasy:{r:65,sc:[0,2,4,6,7,9,11],bpm:92,bar:8,w:'sine',bw:'sine',dens:.85,hi:12},
  space:{r:57,sc:[0,2,3,5,7,8,10],bpm:124,bar:8,w:'square',bw:'sawtooth',dens:.9,mv:.035},
  jungle:{r:57,sc:[0,3,5,7,10],bpm:116,bar:8,w:'triangle',bw:'triangle',dens:.7},
  horror:{r:50,sc:[0,1,4,5,7,8,11],bpm:66,bar:8,w:'sine',bw:'sawtooth',dens:.45,drone:1},
};
let mNext=0,mStep=0,mMel=4;
function playStep(m,i,t,sp){
  const bar=m.bar,pos=i%bar,prog=[0,3,4,5][Math.floor(i/bar)%4],len=m.sc.length;
  const deg=k=>m.r+m.sc[((k%len)+len)%len]+12*Math.floor(k/len);
  if(pos===0){note(mid(deg(prog)-24),t,sp*bar*.8,m.bw,m.drone?.06:.12,musicGain);if(m.drone)note(mid(m.r-36),t,sp*bar*1.1,'sine',.18,musicGain);}
  if(!m.drone&&pos===Math.floor(bar/2))note(mid(deg(prog+2)-12),t,sp*1.5,m.bw,.06,musicGain);
  if(Math.random()<m.dens){mMel=clamp(mMel+Math.round(rnd(-2.4,2.4)),prog-1,prog+8);note(mid(deg(mMel)+(m.hi||0)),t,sp*(m.drone?3:1.5),m.w,m.mv||.07,musicGain);}
}
setInterval(()=>{if(snd<2||!actx||document.hidden||!S)return;const m=MUS[S.theme]||MUS.classic,sp=60/m.bpm/2,now=actx.currentTime;
  if(mNext<now)mNext=now+.05;while(mNext<now+.35){playStep(m,mStep++,mNext,sp);mNext+=sp;}},120);
function sndLabel(){$('#sndBtn').innerHTML=`<span class="pl">Son</span>${['Coupé','Effets','Musique'][snd]}`;$('#sndBtn').title=['Son coupé','Effets sonores','Musique + effets'][snd];}

// ====================== BOUCLE ======================
function loop(ts){
  const dt=Math.min(100,ts-(last||ts));last=ts;
  if(S&&!modal&&speed>0){acc+=dt*speed/MS_PER_MIN;let n=0;while(acc>=1&&n<10){tick();acc-=1;n++;if(modal)break;}}
  requestAnimationFrame(loop);
}
setInterval(()=>{if(!S)return;header();if(!holding&&!modal)render();},900);

// ====================== SAUVEGARDE ======================
let PARKS=[],CUR=0;
const EXPAND_COST=40000;
function strip(x){return{...x,offer:null,b:x.b.map(b=>({id:b.id,type:b.type,lvl:b.lvl,price:b.price,visitors:b.visitors,revenue:b.revenue,cfg:b.cfg,cname:b.cname,parcel:b.parcel,rel:b.rel,broken:b.broken,repairT:b.repairT,age:b.age||0,yRev:b.yRev??null,yVis:b.yVis??null}))};}
function save(){try{PARKS[CUR]=strip(S);localStorage.setItem(SAVE_KEY,JSON.stringify({v:4,cur:CUR,parks:PARKS}));}catch(_){}}
function hydrate(o){S=o;S.rd=S.rd||{level:0,cur:null,prog:0,done:[]};S.fpPrice=S.fpPrice||10;if(!S.staff){S.staff=[];for(const[k,r]of[['janitors','janitor'],['mechanics','mechanic'],['animators','animator']])for(let i=0;i<(S[k]||0);i++){const m={id:S.nid++,role:r,lvl:1,name:pick(FIRST)+' '+String.fromCharCode(65+(Math.random()*26|0))+'.',morale:70};m.salary=fairWage(m);S.staff.push(m);}}applyTheme();if(!S.cands||!S.cands.length)S.cands=[makeCand(),makeCand(),makeCand(),makeCand()];S.reviews=S.reviews||[];S.diff=S.diff||'normal';S.rival=S.rival||{name:'WonderLand',rating:58};S.offer=null;S.privateAt=null;S.time=OPEN;S.today=newDay();S.series=[];S.b.forEach(b=>{rtInit(b);b.todayVis=0;b.todayRev=0;});guests=[];}
function load(){try{let raw=localStorage.getItem(SAVE_KEY),data=null;
  if(raw)data=JSON.parse(raw);else{const old=localStorage.getItem('parcmania_v3');if(old)data={cur:0,parks:[JSON.parse(old)]};}
  if(!data||!Array.isArray(data.parks)||!data.parks.length)return false;PARKS=data.parks;CUR=clamp(data.cur||0,0,PARKS.length-1);hydrate(PARKS[CUR]);return true;}catch(_){return false;}}
function switchPark(i){if(i===CUR)return;save();CUR=i;hydrate(PARKS[i]);tab='home';closeSheet();render();toast(`${THEMES[S.theme].e} Bienvenue à ${S.name} (${LOC().n})`);}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S)save();});

if(!load()){newGame();PARKS=[null];CUR=0;}
sndLabel();render();
if(!S.seenWelcome)openSheet(welcomeHTML);
requestAnimationFrame(loop);
</script>
</body>
